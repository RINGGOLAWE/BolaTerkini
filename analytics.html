
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analytics - BolaTerkini</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#071426;
  color:#fff;
}
header{
  background:#0d2038;
  padding:20px;
  border-bottom:1px solid #263d58;
}
header h1{margin:0;color:#e9bd59}
header p{color:#aebed0;margin-bottom:0}
main{max-width:1100px;margin:auto;padding:20px}
button{
  background:#e9bd59;color:#071426;
  border:0;padding:11px 16px;
  border-radius:8px;font-weight:bold;
  cursor:pointer;
}
.cards{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;margin:20px 0;
}
.card,.panel{
  background:#10243c;
  border:1px solid #263d58;
  border-radius:12px;padding:18px;
}
.card small{color:#aebed0}
.card h2{font-size:30px;margin:12px 0 0;color:#e9bd59}
.panel{margin-bottom:18px}
.panel h3{margin-top:0;color:#e9bd59}
.chart{
  display:flex;align-items:end;gap:10px;
  height:190px;padding-top:15px;
}
.bar-item{
  flex:1;min-width:0;text-align:center;
  display:flex;flex-direction:column;
  justify-content:end;height:100%;gap:8px;
}
.bar{
  width:100%;min-height:3px;
  background:#e9bd59;border-radius:5px 5px 0 0;
}
.bar-item small{font-size:11px;color:#aebed0}
.bar-item b{font-size:11px}
table{width:100%;border-collapse:collapse}
td,th{
  padding:12px 8px;text-align:left;
  border-bottom:1px solid #263d58;
  font-size:13px;
}
th{color:#e9bd59}
.table-wrap{overflow-x:auto}
.muted{color:#aebed0}
#status{margin:15px 0;color:#e9bd59}
@media(max-width:550px){
  main{padding:12px}
  .cards{gap:9px}
  .card{padding:13px}
  .card h2{font-size:24px}
  td,th{font-size:12px}
}
</style>
</head>

<body>
<header>
  <h1>⚽ BolaTerkini Analytics</h1>
  <p>Statistik pengunjung website</p>
</header>

<main>
  <div id="status">Memeriksa akses admin...</div>

  <div id="dashboard" hidden>
    <button onclick="loadAnalytics()">↻ Refresh Statistik</button>

    <section class="cards">
      <div class="card">
        <small>Total Pengunjung Unik</small>
        <h2 id="totalVisitors">0</h2>
      </div>
      <div class="card">
        <small>Pengunjung Hari Ini</small>
        <h2 id="todayVisitors">0</h2>
      </div>
      <div class="card">
        <small>Total Halaman Dibuka</small>
        <h2 id="totalViews">0</h2>
      </div>
      <div class="card">
        <small>Artikel Terpopuler</small>
        <h2 id="popularCount">0</h2>
      </div>
    </section>

    <section class="panel">
      <h3>Kunjungan 7 Hari Terakhir</h3>
      <div id="chart" class="chart"></div>
    </section>

    <section class="panel">
      <h3>Artikel Paling Populer</h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Judul Artikel</th><th>Kunjungan</th></tr>
          </thead>
          <tbody id="articlesTable"></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <h3>Halaman Paling Sering Dibuka</h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Halaman</th><th>Kunjungan</th></tr>
          </thead>
          <tbody id="pagesTable"></tbody>
        </table>
      </div>
    </section>
  </div>
</main>

<script>
const SUPABASE_URL =
  "https://hbpwpesycrpfiqsdaqbn.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_XzFAqQu5HwREY--EBtIA4g_MhRsyFrf";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const statusBox = document.getElementById("status");
const dashboard = document.getElementById("dashboard");

function safeNumber(value){
  return Number(value || 0).toLocaleString("id-ID");
}

function cell(text){
  const td = document.createElement("td");
  td.textContent = text;
  return td;
}

async function loadAnalytics(){
  statusBox.textContent = "Memuat statistik...";

  const {data,error} = await db.rpc(
    "get_analytics_dashboard"
  );

  if(error){
    statusBox.textContent =
      "Gagal mengambil statistik: " + error.message;
    return;
  }

  document.getElementById("totalVisitors").textContent =
    safeNumber(data.total_visitors);

  document.getElementById("todayVisitors").textContent =
    safeNumber(data.visitors_today);

  document.getElementById("totalViews").textContent =
    safeNumber(data.page_views_total);

  document.getElementById("popularCount").textContent =
    data.top_articles?.length || 0;

  // Grafik kunjungan
  const chart = document.getElementById("chart");
  chart.replaceChildren();

  const days = data.daily_visits || [];
  const max = Math.max(
    1,...days.map(item => Number(item.views))
  );

  days.forEach(item => {
    const group = document.createElement("div");
    group.className = "bar-item";

    const number = document.createElement("b");
    number.textContent = safeNumber(item.views);

    const bar = document.createElement("div");
    bar.className = "bar";
    bar.style.height =
      Math.max(3,(Number(item.views)/max)*100) + "%";

    const label = document.createElement("small");
    label.textContent = item.day;

    group.append(number,bar,label);
    chart.appendChild(group);
  });

  // Artikel populer
  const articles = document.getElementById("articlesTable");
  articles.replaceChildren();

  (data.top_articles || []).forEach(item => {
    const tr = document.createElement("tr");
    tr.append(
      cell(item.title),
      cell(safeNumber(item.views))
    );
    articles.appendChild(tr);
  });

  if(!articles.children.length){
    const tr = document.createElement("tr");
    tr.append(cell("Belum ada data artikel"),cell("0"));
    articles.appendChild(tr);
  }

  // Halaman populer
  const pages = document.getElementById("pagesTable");
  pages.replaceChildren();

  (data.top_pages || []).forEach(item => {
    const tr = document.createElement("tr");
    tr.append(
      cell(item.page_path),
      cell(safeNumber(item.views))
    );
    pages.appendChild(tr);
  });

  if(!pages.children.length){
    const tr = document.createElement("tr");
    tr.append(cell("Belum ada data halaman"),cell("0"));
    pages.appendChild(tr);
  }

  statusBox.textContent = "Statistik berhasil dimuat.";
}

async function init(){
  const {data,error} = await db.auth.getUser();

  if(error || !data.user){
    statusBox.textContent =
      "Silakan login melalui halaman Admin terlebih dahulu.";
    return;
  }

  const {data:isAdmin,error:adminError} =
    await db.rpc("is_site_admin");

  if(adminError || !isAdmin){
    statusBox.textContent =
      "Akses ditolak. Halaman ini hanya untuk admin.";
    return;
  }

  dashboard.hidden = false;
  await loadAnalytics();
}

init();
</script>
</body>
</html>
